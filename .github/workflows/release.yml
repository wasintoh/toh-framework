# Release — push to main is the whole release process.
#
# Every push to main runs this job. It reads the version in package.json and
# asks npm whether that version already exists:
#   - already on npm  → nothing to release, the job ends green (docs/code push)
#   - not on npm yet  → smoke-test, publish to npm, tag vX.Y.Z, GitHub Release
# So "ship a release" = bump package.json version + CHANGELOG section + push.
#
# Auth: npm Trusted Publishing (OIDC). No NPM_TOKEN secret, nothing expires.
# npmjs.com → toh-framework → Settings → Trusted publishing must list:
#   GitHub Actions · user wasintoh · repo toh-framework · workflow release.yml
#   · allowed actions include `npm publish`.
# Needs npm CLI >= 11.5.1 and Node >= 22.14 on a GitHub-hosted runner.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write # create the tag + GitHub Release
  id-token: write # npm trusted publishing (OIDC) + provenance

# Two quick pushes must not race to publish the same version
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # Decide: is this push a new version?
      - name: Check whether this version is already on npm
        id: ver
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "$NAME@$VERSION is already on npm — nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new — releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          # pre-releases (X.Y.Z-beta.N) go to the "next" dist-tag, not "latest"
          case "$VERSION" in
            *-*) echo "disttag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "disttag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Quality gate: the CLI actually runs + tests pass + the tarball packs clean
      - if: steps.ver.outputs.release == 'true'
        run: npm ci
      - if: steps.ver.outputs.release == 'true'
        run: |
          node bin/toh-cli.js --version
          node bin/toh-cli.js --help
          npm test
          npm run list
          npm pack --dry-run

      # Trusted publishing needs npm >= 11.5.1; fail loudly instead of
      # falling back to token auth with no token
      - name: Check npm supports trusted publishing
        if: steps.ver.outputs.release == 'true'
        run: |
          NPM_V="$(npm --version)"
          echo "npm $NPM_V"
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$NPM_V" \
            || { echo "npm $NPM_V < 11.5.1 — trusted publishing unsupported" >&2; exit 1; }

      # OIDC auth, no token. Provenance is attached automatically.
      - name: Publish to npm (trusted publishing)
        if: steps.ver.outputs.release == 'true'
        run: npm publish --access public --tag "${{ steps.ver.outputs.disttag }}"

      # Pull the matching "## [X.Y.Z]" section out of CHANGELOG.md
      - name: Extract changelog section
        if: steps.ver.outputs.release == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if ! [ -s RELEASE_BODY.md ]; then
            echo "No CHANGELOG.md section for ${VERSION} — see CHANGELOG.md." > RELEASE_BODY.md
          fi

      # Creates tag vX.Y.Z on this commit + the GitHub Release
      - name: Create tag + GitHub Release
        if: steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file RELEASE_BODY.md $PRE
