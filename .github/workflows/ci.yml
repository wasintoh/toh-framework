# CI — smoke gate on every push to main and every PR, across Node 18 (engines
# floor) and 22. The repo has no automated test suite yet; until it does, CI
# proves the CLI runs headless and the npm tarball packs clean.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: node bin/toh-cli.js --version
      - run: node bin/toh-cli.js --help
      - run: npm test
      - run: npm run list
      - run: npm run status
      - run: npm pack --dry-run
